<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrisa 宗楚宜 22歲生日快樂！🎉</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #4a4a4a;
        }
        .card-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #ff7e5f;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        h1 { font-size: 2rem; color: #2c3e50; margin-bottom: 10px; line-height: 1.3; }
        p.subtitle { font-size: 1rem; color: #7f8c8d; margin-bottom: 25px; }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #000;
            margin-bottom: 20px;
        }
        
        /* 使用 HTML5 原生影片播放器，播放按鈕與時間線都會非常適中 */
        video {
            width: 100%;
            max-height: 70vh;
            display: block;
            border-radius: 16px;
        }

        .footer-text { font-size: 0.95rem; color: #666; line-height: 1.6; }
        .heart { color: #e74c3c; display: inline-block; }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="badge">HAPPY 22ND BIRTHDAY</div>
        <h1>親愛的 Terrisa 宗楚宜<br>22歲生日快樂！🎂</h1>
        <p class="subtitle">這是我特別為你準備的小驚喜，點開看看吧！✨</p>

        <div class="video-wrapper">
            <video controls playsinline controlsList="nodownload" preload="metadata">
                <source src="https://lh3.googleusercontent.com/d/1d0EoVJsw6D2w7VlZfWToUyyfGMk_L8EO=s0" type="video/mp4">
                你的瀏覽器不支援影片播放。
            </video>
        </div>

        <p class="footer-text">
            祝楚宜 22 歲生日快樂！願新的一歲充滿陽光、笑容與無限可能 <span class="heart">❤️</span>
        </p>
    </div>
</body>
</html>
