<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrisa 宗楚宜 22歲生日快樂！🎉</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #4a4a4a;
        }
        .card-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #ff7e5f;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        h1 { font-size: 2rem; color: #2c3e50; margin-bottom: 10px; line-height: 1.3; }
        p.subtitle { font-size: 1rem; color: #7f8c8d; margin-bottom: 25px; }
        
        /* 響應式影片容器 */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 比例 */
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #000;
            margin-bottom: 20px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .footer-text { font-size: 0.95rem; color: #666; line-height: 1.6; }
        .heart { color: #e74c3c; display: inline-block; }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="badge">HAPPY 22ND BIRTHDAY</div>
        <h1>親愛的 Terrisa 宗楚宜<br>22歲生日快樂！🎂</h1>
        <p class="subtitle">這是我特別為你準備的小驚喜，點開看看吧！✨</p>

        <div class="video-wrapper">
            <!-- 👇 請把你在 Google Drive 複製的 <iframe>...</iframe> 整段貼在下面替換掉這行 -->
            <iframe src="https://drive.google.com/file/d/YOUR_FILE_ID/preview" allow="autoplay"></iframe>
        </div>

        <p class="footer-text">
            祝楚宜 22 歲生日快樂！願新的一歲充滿陽光、笑容與無限可能 <span class="heart">❤️</span>
        </p>
    </div>
</body>
</html>
